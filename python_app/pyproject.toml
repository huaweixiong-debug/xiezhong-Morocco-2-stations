[project]
name = "leak-test-2-channels"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
live = ["PySide6>=6.6", "python-snap7>=2.0", "pyserial>=3.5", "PyMySQL>=1.1", "cryptography>=42"]
test = ["pytest>=9", "PySide6>=6.6"]

[project.scripts]
leak-test = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
